# CLI alternative to the UI: builds this repo and puts it behind the gateway (mcp-proxy trait).
apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: mock-mcp
  namespace: default
spec:
  owner:
    projectName: default
  componentType:
    kind: ClusterComponentType
    name: deployment/service
  autoDeploy: true
  workflow:
    kind: ClusterWorkflow
    name: dockerfile-builder
    parameters:
      repository:
        url: "https://github.com/SaviNimz/mock-mcp-server"
        revision:
          branch: "main"
        appPath: "."
      docker:
        context: "."
        filePath: "./Dockerfile"
  traits:
    - name: mcp-proxy
      kind: ClusterTrait
      instanceName: mock-mcp-proxy
      parameters:
        endpoint: mcp
        issuers: ["Asgardeo"]
        requiredScopes: ["mcp:access"]
